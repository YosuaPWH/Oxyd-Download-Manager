name: Build installer

# Builds the Windows installers (NSIS setup .exe and .msi) for every push to main and attaches them to the run as an
# artifact (Actions tab -> the run -> Artifacts). Use "Run workflow" to build any branch.
#
# Pushing a tag such as v0.1.0 also publishes a GitHub Release with the installers, the
# extension and the checksums. The tag must match the version in tauri.conf.json:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A newer push makes the build of an older commit pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer:
    name: Windows installers (NSIS and MSI)
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact: ${{ steps.collect.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # A release must not ship the wrong version: v0.2.0 on a tree that still says 0.1.0.
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version" -and -not $tag.StartsWith("v$version-")) {
            throw "Tag $tag does not match the app version $version (app/src-tauri/tauri.conf.json, Cargo.toml and both package.json files must agree)."
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            extension/package-lock.json

      # Builds oxyd-bridge.exe (sidecar), the browser extension and the Tauri app, then
      # bundles the NSIS setup (target/release/bundle/nsis) and the MSI (bundle/msi).
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      - name: Collect release files
        id: collect
        shell: pwsh
        run: |
          $version = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $out = New-Item -ItemType Directory -Path out -Force

          # File names carry only the version; the commit is in the artifact name.
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "installer not found in target/release/bundle/nsis" }
          Copy-Item $installer.FullName "$out/Oxyd-Setup-$version.exe"

          # Pre-release versions (0.2.0-beta.1) are not valid MSI versions: NSIS only.
          $msi = Get-ChildItem target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msi) { Copy-Item $msi.FullName "$out/Oxyd-Setup-$version.msi" }
          elseif ($version -notmatch '-') { throw "MSI not found in target/release/bundle/msi" }

          # The unpacked extension for "Load unpacked" in Chrome/Edge.
          Compress-Archive -Path extension/build/* -DestinationPath "$out/Oxyd-Extension-$version.zip"

          Push-Location $out
          Get-FileHash -Algorithm SHA256 (Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt') |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content SHA256SUMS.txt -Encoding ascii
          Pop-Location

          "name=oxyd-windows-x64-$version-$short" >> $env:GITHUB_OUTPUT

          "### Oxyd $version ($short)" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "| File | Size |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem $out | ForEach-Object {
            "| $($_.Name) | $([math]::Round($_.Length / 1MB, 2)) MB |" >> $env:GITHUB_STEP_SUMMARY
          }
          "" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content "$out/SHA256SUMS.txt" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub release
    needs: installer
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.installer.outputs.artifact }}
          path: out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          # v0.1.0-beta.1 and similar are marked as pre-releases.
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # The release exists already (drafted in the web UI, or this tag is being
            # re-released): replace its files so no stale ones with old names remain.
            gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' |
              while read -r asset; do gh release delete-asset "$TAG" "$asset" --yes --repo "$REPO"; done
            gh release upload "$TAG" out/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" out/* --repo "$REPO" --title "Oxyd $TAG" --generate-notes $flags
          fi
