<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <title>Oxyd</title>
  </head>
  <body>
    <header>
      <img src="icons/32x32.png" alt="" width="24" height="24" />
      <h1>Oxyd</h1>
      <span id="status" class="status checking"></span>
    </header>

    <label class="toggle">
      <input type="checkbox" id="enabled" />
      <span data-i18n="capture">Capture downloads</span>
    </label>

    <button id="skip" type="button" data-i18n="skip">Let the next download go to the browser</button>

    <label class="toggle">
      <input type="checkbox" id="videoButton" />
      <span data-i18n="videoButton">Show a download button on videos</span>
    </label>

    <button id="pageVideo" type="button" data-i18n="pageVideo">Download the video on this page</button>

    <details id="videoOverlay">
      <summary data-i18n="videoOverlay">Video overlay</summary>
      <form id="overlayForm">
        <div class="overlay-fields">
          <label><span data-i18n="defaultSize">Default size</span>
            <select id="defaultSize">
              <option value="standard" data-i18n="standard">Standard</option>
              <option value="compact" data-i18n="compact">Icon only</option>
            </select>
          </label>
          <label><span data-i18n="defaultCorner">Default corner</span>
            <select id="defaultCorner">
              <option value="top-right" data-i18n="topRight">Top right</option>
              <option value="top-left" data-i18n="topLeft">Top left</option>
              <option value="bottom-right" data-i18n="bottomRight">Bottom right</option>
              <option value="bottom-left" data-i18n="bottomLeft">Bottom left</option>
            </select>
          </label>
        </div>
        <fieldset id="siteOverlay" hidden>
          <legend id="overlayHost"></legend>
          <div class="overlay-fields">
            <label><span data-i18n="siteSize">Size on this site</span>
              <select id="siteSize">
                <option value="" data-i18n="useDefault">Use default</option>
                <option value="standard" data-i18n="standard">Standard</option>
                <option value="compact" data-i18n="compact">Icon only</option>
              </select>
            </label>
            <label><span data-i18n="siteCorner">Corner on this site</span>
              <select id="siteCorner">
                <option value="" data-i18n="useDefault">Use default</option>
                <option value="top-right" data-i18n="topRight">Top right</option>
                <option value="top-left" data-i18n="topLeft">Top left</option>
                <option value="bottom-right" data-i18n="bottomRight">Bottom right</option>
                <option value="bottom-left" data-i18n="bottomLeft">Bottom left</option>
              </select>
            </label>
          </div>
        </fieldset>
        <div class="row">
          <span id="overlayStatus" role="status"></span>
          <button id="saveOverlay" type="submit" class="primary" data-i18n="saveLayout" disabled>Save layout</button>
        </div>
      </form>
    </details>

    <details>
      <summary data-i18n="filters">Filters</summary>
      <label for="minSize" data-i18n="minSize">Minimum size (MB)</label>
      <input id="minSize" type="number" min="0" step="0.1" />
      <label for="extensions" data-i18n="extensions">File types</label>
      <textarea id="extensions" rows="4" spellcheck="false"></textarea>
      <label for="excluded" data-i18n="excluded">Never capture from these domains</label>
      <textarea id="excluded" rows="3" spellcheck="false" placeholder="example.com"></textarea>
      <div class="row">
        <button id="reset" type="button" data-i18n="reset">Reset</button>
        <button id="save" type="button" class="primary" data-i18n="save">Save</button>
      </div>
    </details>
    <p id="managed" hidden data-i18n="managed">Capture settings are managed by the Oxyd app.</p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
