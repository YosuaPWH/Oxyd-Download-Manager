[workspace]
resolver = "2"
members = [
    "crates/oxyd-core",
    "crates/oxyd-cli",
    "crates/oxyd-protocol",
    "crates/oxyd-bridge",
    "test-server",
    "app/src-tauri",
]

[workspace.package]
version = "0.3.0-beta.1"
edition = "2021"
license = "MIT"
authors = ["Oxyd Download Manager contributors"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "socks", "gzip"] }
futures = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
interprocess = { version = "2", features = ["tokio"] }
directories = "5"
percent-encoding = "2"
bytes = "1"
oxyd-core = { path = "crates/oxyd-core" }
oxyd-protocol = { path = "crates/oxyd-protocol" }

[profile.release]
# Smaller binaries and installer, less memory at idle.
lto = "thin"
codegen-units = 1
strip = true
